# ============================================================
# UmlPilot - despliegue de producción (HTTP, sin dominio ni HTTPS)
#
#   Levantar:  docker compose -f docker-compose.prod.yml up -d --build
#   Acceso:    http://<host>:80   (solo umlpilot-nginx publica puertos)
#
#   Todo se configura en UN solo archivo .env (el backend lo lee al
#   arrancar, no se le vuelven a pasar variables por `environment`).
#   Requisito en ese .env para este despliegue:
#     DB_HOST=umlpilot-db   DB_PORT=5432
# ============================================================

name: umlpilot

services:
  # ---------- PostgreSQL (solo red interna) ----------
  umlpilot-db:
    image: postgres:16
    container_name: umlpilot_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - umlpilot_db_data:/var/lib/postgresql/data
    networks:
      - umlpilot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Backend Spring Boot (solo red interna) ----------
  # No lleva `environment`: lee DB_HOST, JWT_SECRET, claves de IA, etc. del .env.
  umlpilot-api:
    build:
      context: ./umlpilot_api
      dockerfile: Dockerfile.prod
    image: umlpilot-api:latest
    container_name: umlpilot_api
    restart: unless-stopped
    environment:
      # Dentro de la red de compose la BD es el servicio, no localhost
      DB_HOST: umlpilot-db
      DB_PORT: "5432"
    depends_on:
      umlpilot-db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - umlpilot-net

  # ---------- Frontend SPA (solo red interna) ----------
  umlpilot-web:
    build:
      context: ./umlpilot_web
      dockerfile: Dockerfile.prod
    image: umlpilot-web:latest
    container_name: umlpilot_web
    restart: unless-stopped
    depends_on:
      - umlpilot-api
    networks:
      - umlpilot-net

  # ---------- nginx de borde (único punto de entrada) ----------
  umlpilot-nginx:
    image: nginx:stable-alpine
    container_name: umlpilot_nginx
    restart: unless-stopped
    depends_on:
      - umlpilot-web
      - umlpilot-api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"   # HTTP
    networks:
      - umlpilot-net

volumes:
  umlpilot_db_data:

networks:
  umlpilot-net:
    name: umlpilot-net
    driver: bridge
