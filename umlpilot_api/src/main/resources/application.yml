spring:
  application:
    name: umlpilot_api
  
  # Configuración de la base de datos PostgreSQL con variables de entorno
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:umlpilot_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # Configuración de JPA
  jpa:
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: update  # Opciones: none, validate, update, create, create-drop
    open-in-view: false
  
  # Configuración de multipart para subida de archivos
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  # Configuración de mail (COMENTADA - no necesaria por ahora)
  # mail:
  #   host: smtp.gmail.com
  #   port: 587
  #   username: tu_email@gmail.com
  #   password: tu_contraseña
  #   properties:
  #     mail:
  #       smtp:
  #         auth: true
  #         starttls:
  #           enable: true

# Configuración del servidor
server:
  port: ${SERVER_PORT:8080}

# Configuración de logging
logging:
  level:
    root: INFO
    com.umlpilot: DEBUG  # Cambiado de com.financesystem a com.umlpilot
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Configuración de Actuator (monitoreo)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Configuración de Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

