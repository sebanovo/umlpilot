# Perfil secundario: H2 en archivo
# Actívalo con SPRING_PROFILES_ACTIVE=h2 (o --spring.profiles.active=h2)
#
# NON_KEYWORDS=VALUE permite usar 'value' como columna (la tabla literal la usa).
# La ruta del fichero es configurable con H2_DATA_PATH (por defecto ./data).
app:
  chat:
    # En H2/tests no hay MongoDB; el chat queda deshabilitado hasta configurar MONGODB_URI
    index-initialization-enabled: false

spring:
  datasource:
    url: jdbc:h2:file:${H2_DATA_PATH:./data}/umlpilot_db;AUTO_SERVER=TRUE;NON_KEYWORDS=VALUE
    username: ${H2_USER:sa}
    password: ${H2_PASSWORD:}
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database: H2
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
