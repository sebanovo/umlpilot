# UmlPilot Web: sirve la SPA compilada (Vite/React).
# El enrutado de /api y /ws lo hace el nginx de borde (servicio umlpilot-nginx).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los activos de texto
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Activos con hash en el nombre: cacheables indefinidamente
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
