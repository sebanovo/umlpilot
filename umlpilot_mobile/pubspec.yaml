name: umlpilot_mobile
description: "UMLPilot mobile - cliente Flutter del backend UMLPilot (visualización en tiempo real)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.0
  provider: ^6.1.5+1
  get_it: ^9.2.1
  dio: ^5.9.2
  go_router: ^17.2.0
  flutter_secure_storage: ^9.2.4
  stomp_dart_client: ^2.0.0
  share_plus: ^10.1.4
  intl: ^0.20.2
  record: ^7.1.2
  path_provider: ^2.1.6
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
