# UmlPilot - nginx de borde (HTTP, sin dominio ni HTTPS).
# Punto de entrada único: sirve la SPA y enruta /api y /ws hacia el backend.
server {
    listen 80;
    server_name _;

    # Permite subidas grandes (importación XMI, imágenes del asistente: 10 MB)
    client_max_body_size 20M;

    # ---------- Frontend (SPA) ----------
    location / {
        proxy_pass http://umlpilot-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- API REST ----------
    location /api/ {
        proxy_pass http://umlpilot-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El asistente de IA y la generación pueden tardar
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- WebSocket STOMP (colaboración en tiempo real) ----------
    location /ws {
        proxy_pass http://umlpilot-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mantiene viva la conexión (heartbeats STOMP)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

